name: Generate and publish product feed

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run feed generator
        id: run_feed
        env:
          BASE_URL: "https://sto.cross-export.ru"
        run: |
          python fix_feed.py

      - name: Validate generated XML
        id: validate
        run: |
          FILE=docs/feed.xml
          if [ ! -f "$FILE" ]; then echo "Feed file not found: $FILE"; exit 1; fi
          python - <<'PY'
import sys
from xml.etree import ElementTree as ET
try:
    ET.parse('docs/feed.xml')
    print('XML is well-formed')
except Exception as e:
    print('XML validation error:', e)
    sys.exit(2)
PY

      - name: Show summary (optional)
        if: success()
        run: |
          echo "Feed generated successfully"
          wc -c docs/feed.xml || true

      - name: Commit and push changes
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(feed): auto-update feed.xml [skip ci]"
          file_pattern: "docs/feed.xml"
          branch: "main"
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
